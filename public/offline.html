<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta name="theme-color" content="#12372a">

  <title>Offline | Triveni Pustakalaya</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f7f8f5;
      color: #12372a;
      text-align: center;
    }

    .box {
      max-width: 500px;
      padding: 40px 25px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 15px 50px rgba(0,0,0,.08);
    }

    img {
      width: 90px;
      height: 90px;
      object-fit: contain;
      margin-bottom: 20px;
    }

    h1 {
      margin: 0 0 12px;
    }

    p {
      color: #66736c;
      line-height: 1.7;
    }

    button {
      border: 0;
      padding: 13px 22px;
      border-radius: 12px;
      background: #12372a;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <div class="box">

    <img src="/tv.png" alt="Triveni Pustakalaya">

    <h1>You are offline</h1>

    <p>
      Triveni Pustakalaya is currently offline.
      Previously visited educational resources may still be available.
    </p>

    <button onclick="location.reload()">
      Try Again
    </button>

  </div>

</body>
</html>
